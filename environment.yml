name: inn_final
channels:
  - pytorch
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # PyTorch with CUDA 12.4 support
  - pytorch=2.4.0
  - torchvision=0.19.0
  - pytorch-cuda=12.4

  # Scientific Computing
  - numpy=1.24.3
  - scipy=1.10.1
  - pandas=2.0.2

  # Visualization
  - matplotlib=3.7.1
  - seaborn=0.12.2

  # Machine Learning
  - pytorch-lightning=2.0.2

  # Development tools
  - pip=23.1.2

  # Pip-only packages
  - pip:
    - FrEIA==0.2
    - geomloss==0.2.6
